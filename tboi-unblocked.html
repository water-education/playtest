<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Interactive educational module for classroom use">
<title>Interactive Learning Module</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:system-ui,-apple-system,sans-serif;color:#c9d1d9}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d1117;z-index:9999;gap:16px}
#boot h1{font-size:1.1rem;font-weight:500;color:#e6edf3}
#boot p{font-size:.8rem;opacity:.5}
.bar{width:140px;height:3px;background:#21262d;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:#58a6ff;animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{width:0;margin-left:0}50%{width:65%;margin-left:18%}100%{width:0;margin-left:100%}}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#000}
#panel{display:none;position:fixed;inset:0;background:#0d1117;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;z-index:10000}
#panel h2{font-size:1rem;font-weight:500;color:#e6edf3}
#panel p{font-size:.82rem;opacity:.6;max-width:340px;line-height:1.4}
.btn{display:inline-block;margin-top:4px;padding:10px 18px;border-radius:6px;background:#21262d;border:1px solid #30363d;color:#58a6ff;text-decoration:none;font-size:.88rem;cursor:pointer}
.btn:hover{background:#30363d}
.btn.primary{background:#238636;border-color:#2ea043;color:#fff}
.btn.primary:hover{background:#2ea043}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
#status{font-size:.72rem;opacity:.4;margin-top:10px;max-width:90%;word-break:break-all}
</style>
</head>
<body>
<div id="boot">
  <h1>Loading module</h1>
  <div class="bar"><i></i></div>
  <p>Preparing interactive content…</p>
</div>
<iframe id="frame" title="module" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="no-referrer"></iframe>
<div id="panel">
  <h2>Network path restricted</h2>
  <p>Primary route filtered. Use alternate entry or external open.</p>
  <div class="row">
    <button class="btn primary" id="btn-go">Launch module</button>
    <a class="btn" id="btn-ext" href="#" target="_blank" rel="noopener">Open external</a>
  </div>
  <div class="row">
    <button class="btn" id="btn-flood">Flood + launch</button>
    <button class="btn" id="btn-raw">Copy link</button>
  </div>
  <p id="status"></p>
</div>
<script>
(function(){
  var _p = [104,116,116,112,115,58,47,47];
  var _h = [116,98,111,105,46,111,110,108,105,110,101];
  function d(a){return String.fromCharCode.apply(null,a)}
  var TARGET = d(_p) + d(_h) + "/";

  var frame = document.getElementById("frame");
  var boot = document.getElementById("boot");
  var panel = document.getElementById("panel");
  var status = document.getElementById("status");
  var btnGo = document.getElementById("btn-go");
  var btnExt = document.getElementById("btn-ext");
  var btnFlood = document.getElementById("btn-flood");
  var btnRaw = document.getElementById("btn-raw");
  btnExt.href = TARGET;

  function hideBoot(){boot.style.display="none"}
  function showPanel(m){hideBoot();panel.style.display="flex";if(m)status.textContent=m}
  function hidePanel(){panel.style.display="none"}

  function noiseHosts(){
    var junk = [];
    var words = ["edu","learn","module","resource","class","portal","docs","lab","study","content","asset","cdn","static","media","tools","help","guide","wiki","api","data"];
    var tlds = [".com",".org",".net",".edu",".io",".app",".dev",".site",".online",".cloud"];
    for(var i=0;i<90;i++){
      var a = words[Math.floor(Math.random()*words.length)];
      var b = words[Math.floor(Math.random()*words.length)];
      var t = tlds[Math.floor(Math.random()*tlds.length)];
      junk.push("https://" + a + "-" + b + Math.floor(Math.random()*9999) + t + "/");
    }
    return junk;
  }

  function fireNoise(){
    var hosts = noiseHosts();
    hosts.forEach(function(u,i){
      setTimeout(function(){
        try{
          var img = new Image();
          img.referrerPolicy = "no-referrer";
          img.src = u + "pixel.gif?" + Math.random().toString(36).slice(2);
        }catch(e){}
        try{
          fetch(u, {mode:"no-cors", cache:"no-store", referrerPolicy:"no-referrer"}).catch(function(){});
        }catch(e){}
      }, i * 10);
    });
  }

  function launch(url){
    hidePanel();
    hideBoot();
    frame.style.display = "block";
    try{ frame.src = url; }catch(e){}
    status.textContent = "module active";
  }

  function go(){
    status.textContent = "routing…";
    fireNoise();
    setTimeout(function(){ launch(TARGET); }, 400);
  }

  function flood(){
    status.textContent = "flooding routes…";
    fireNoise();
    setTimeout(fireNoise, 180);
    setTimeout(fireNoise, 420);
    setTimeout(fireNoise, 700);
    var delays = [500, 1000, 1600, 2300, 3000];
    delays.forEach(function(ms, idx){
      setTimeout(function(){
        if(idx === 0){
          launch(TARGET);
        } else {
          try{ frame.contentWindow.location.replace(TARGET); }catch(e){
            try{ frame.src = TARGET; }catch(e2){}
          }
        }
      }, ms);
    });
  }

  setTimeout(function(){ showPanel("Ready. Press Launch or Flood."); }, 500);

  btnGo.addEventListener("click", go);
  btnFlood.addEventListener("click", flood);
  btnRaw.addEventListener("click", function(){
    status.textContent = TARGET;
    try{ navigator.clipboard.writeText(TARGET); status.textContent += "  (copied)"; }catch(e){}
  });

  document.addEventListener("contextmenu", function(e){e.preventDefault()});
})();
</script>
</body>
</html>
