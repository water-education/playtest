<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Output v1.2</title>
    <style>
   body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a1a;
    color: #d4d4d4;
    margin: 0;
    padding: 10px;
   }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: #000;
    border: 1px solid #444;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    height: 90vh;
    display: flex;
    flex-direction: column;
   }
  .header {
    background: #333;
    border-bottom: 1px solid #444;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-family: monospace;
   }
   .status-green { color: #4caf50; }
   .status-red { color: #f44336; }
   .status-yellow { color: #ff9800; }

   #app {
    flex: 1;
    overflow-y: auto;
    background: #fff;
    padding: 15px;
    position: relative;
   }
    /* Loading Spinner */
  .loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 4px solid #f3f3f3;
    border-top: 4px solid #343a40;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    display: none;
   }
    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
    <span>CLIENT.FE.EXEC</span>
    <span>STATUS: <span id="status" class="status-yellow">INITIALIZING...</span></span>
    <span>HOST: <span id="ping">--</span></span>
    </div>
    <div id="app">
    <div id="loader" class="loader"></div>
    <div id="fallback" style="display:none; color: #dc3545; font-weight: bold;">CONNECTION LOST. RETRYING...</div>
    </div>
</div>

<script>
    // ------------------------------------------
    // CONFIGURATION
    // %s in the URL acts as a placeholder for the target URL
    // ------------------------------------------
  
    // Use AllOrigins as the middleware to bypass CORS and Mixed Content issues
    // This fetches the page content as plain text.
    const encodedConfig = btoa('%s?url=https://tboi.online');

    // The fetch function
    async function fetchGame() {
    const statusEl = document.getElementById('status');
    const loaderEl = document.getElementById('loader');
    const fallbackEl = document.getElementById('fallback');
    const pingEl = document.getElementById('ping');

   try {
    // Step 1: Decode the proxy URL
    const url = atob(encodedConfig);

    statusEl.textContent = "ESTABLISHING CONNECTION...";
    statusEl.className = ""; // Reset colors
    loaderEl.style.display = 'block';

    // Step 2: Fetch the proxy data
    // AllOrigins returns JSON: { contents: "<html>...</html>", status: 200 }
    const startTime = performance.now();
  
    const response = await fetch(url, {
    method: 'GET'
  });

    const ping = Math.round(performance.now() - startTime);
    pingEl.textContent = ping + "ms";

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
  
    // Step 3: Extract the raw HTML from the JSON wrapper
    const htmlContent = data.contents;

    if (!htmlContent) throw new Error("Empty response");

    loaderEl.style.display = 'none';
    statusEl.textContent = "LOADED SUCCESSFULLY";
    statusEl.className = "status-green";

    // Step 4: Inject and Fix Paths
    // Jina.ai and similar proxies sometimes strip domains, 
    // but we rewrite relative links to ensure assets (images/css) load correctly.
    const finalHtml = fixRelativePaths(htmlContent);
  
    document.getElementById('app').innerHTML = finalHtml;

    } catch (error) {
    console.error("Fetch Error:", error);
    loaderEl.style.display = 'none';
    fallbackEl.style.display = 'block';
    statusEl.textContent = "CONNECTION FAILED";
    statusEl.className = "status-red";
   }
  }

   /**
    * Takes the raw HTML and rewrites relative URLs to absolute URLs.
    * This prevents images and resources from breaking because the 
    * proxy changed the effective context.
   */
    function fixRelativePaths(html) {
    // Get the base domain from the 'src' attribute of the fetched HTML string
    // This finds something like src="https://r.jina.ai/http://tboi.online/..."
    const baseUrlMatch = html.match(/src="([^"]+)"/);
  
    if (!baseUrlMatch) return html; // Fallback if URL extraction fails

    const activeBaseUrl = baseUrlMatch[1]; 
    // Extract just the base (protocol + domain)
    const baseDomain = activeBaseUrl.split('/')[0] + '//' + activeBaseUrl.split('/')[2];

    // 1. Fix Scripts
    html = html.replace(/<script src="\/(.*?)">/g, `<script src="${baseDomain}/$1">`);

    // 2. Fix Stylesheets
    html = html.replace(/<link rel="stylesheet" href="\/(.*?)">/g, `<link rel="stylesheet" href="${baseDomain}/$1">`);

    // 3. Fix Images
    html = html.replace(/<img src="\/(.*?)">/g, `<img src="${baseDomain}/$1">`);

    // 4. Fix Paths inside CSS
    html = html.replace(/url\(\/(.*?)\)/g, `url(${baseDomain}/$1)`);

    return html;
  }

    // Run immediately
    setTimeout(fetchGame, 500);

</script>

</body>
</html>
