<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Interactive learning module — educational resource">
<title>Interactive Learning Module</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#c9d1d9}
  #boot{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0d1117;z-index:9999;gap:18px;
  }
  #boot h1{font-size:1.15rem;font-weight:500;color:#e6edf3;letter-spacing:.3px}
  #boot p{font-size:.82rem;opacity:.55}
  .bar{width:160px;height:3px;background:#21262d;border-radius:2px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:#58a6ff;animation:load 1.4s ease-in-out infinite}
  @keyframes load{0%{width:0;margin-left:0}50%{width:70%;margin-left:15%}100%{width:0;margin-left:100%}}
  #frame{
    position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#000;
  }
  #panel{
    display:none;position:fixed;inset:0;background:#0d1117;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;z-index:10000;
  }
  #panel h2{font-size:1.05rem;font-weight:500;color:#e6edf3}
  #panel p{font-size:.85rem;opacity:.65;max-width:360px;line-height:1.45}
  .btn{
    display:inline-block;margin-top:6px;padding:11px 20px;border-radius:6px;
    background:#21262d;border:1px solid #30363d;color:#58a6ff;text-decoration:none;
    font-size:.9rem;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .btn:hover{background:#30363d;border-color:#484f58}
  .btn.primary{background:#238636;border-color:#2ea043;color:#fff}
  .btn.primary:hover{background:#2ea043}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
  #status{font-size:.75rem;opacity:.45;margin-top:12px}
</style>
</head>
<body>
  <div id="boot">
    <h1>Loading module</h1>
    <div class="bar"><i></i></div>
    <p>Preparing interactive content…</p>
  </div>

  <iframe id="frame" title="module" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope" allowfullscreen referrerpolicy="no-referrer"></iframe>

  <div id="panel">
    <h2>Network filter detected</h2>
    <p>Direct path blocked. Choose an alternate route or open externally.</p>
    <div class="row">
      <button class="btn primary" id="btn-try">Try alternate routes</button>
      <a class="btn" id="btn-ext" href="#" target="_blank" rel="noopener">Open external</a>
    </div>
    <div class="row" style="margin-top:4px">
      <button class="btn" id="btn-blank">Blank + inject</button>
      <button class="btn" id="btn-raw">Show raw link</button>
    </div>
    <p id="status"></p>
  </div>

<script>
(function(){
  // target reconstructed at runtime — no plain domain string in static source
  var p = [104,116,116,112,115,58,47,47]; // https://
  var h = [116,98,111,105,46,111,110,108,105,110,101];
  function decode(arr){return String.fromCharCode.apply(null,arr)}
  var TARGET = decode(p) + decode(h) + "/";

  // public web proxies / alternate frontends (rotate if one is also filtered)
  var ROUTES = [
    TARGET,
    "https://corsproxy.io/?" + encodeURIComponent(TARGET),
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(TARGET),
    "https://thingproxy.freeboard.io/fetch/" + TARGET,
    "https://proxy.cors.sh/" + TARGET
  ];

  var frame = document.getElementById("frame");
  var boot = document.getElementById("boot");
  var panel = document.getElementById("panel");
  var status = document.getElementById("status");
  var btnTry = document.getElementById("btn-try");
  var btnExt = document.getElementById("btn-ext");
  var btnBlank = document.getElementById("btn-blank");
  var btnRaw = document.getElementById("btn-raw");

  btnExt.href = TARGET;

  var routeIndex = 0;
  var loadTimer = null;

  function hideBoot(){ if(boot) boot.style.display = "none"; }
  function showPanel(msg){
    hideBoot();
    panel.style.display = "flex";
    if(msg) status.textContent = msg;
  }
  function hidePanel(){ panel.style.display = "none"; }

  function setFrame(url){
    try{
      frame.removeAttribute("sandbox"); // full capabilities for wasm + gamepad
      frame.src = url;
      frame.style.display = "block";
      status.textContent = "Attempting route " + (routeIndex+1) + "/" + ROUTES.length;
    }catch(e){}
  }

  function tryNext(){
    if(routeIndex >= ROUTES.length){
      showPanel("All automated routes failed. Use External or Blank inject.");
      return;
    }
    hidePanel();
    setFrame(ROUTES[routeIndex]);
    routeIndex++;
    clearTimeout(loadTimer);
    // if still on boot after a few seconds, assume blocked and move on
    loadTimer = setTimeout(function(){
      // cross-origin — we can't read contentDocument reliably
      // just surface the panel so user can advance
      showPanel("Route timed out / likely filtered. Try next.");
    }, 7000);
  }

  // primary path: start with direct (fastest if allowed)
  setTimeout(function(){
    tryNext();
  }, 220);

  frame.addEventListener("load", function(){
    clearTimeout(loadTimer);
    hideBoot();
    // if the frame loaded something, keep it; user can still force next if wrong page
  });

  btnTry.addEventListener("click", function(){
    tryNext();
  });

  // about:blank + location injection (some filters only watch initial navigation)
  btnBlank.addEventListener("click", function(){
    hidePanel();
    hideBoot();
    frame.style.display = "block";
    frame.src = "about:blank";
    setTimeout(function(){
      try{
        // most school filters will still see the subsequent navigation, but worth attempting
        frame.contentWindow.location.replace(TARGET);
      }catch(e){
        // sandbox / cross-origin will throw — fall back to src assignment
        frame.src = TARGET;
      }
      status.textContent = "Blank inject attempted";
    }, 300);
  });

  btnRaw.addEventListener("click", function(){
    status.textContent = TARGET;
    // also copy if clipboard allowed
    try{ navigator.clipboard.writeText(TARGET); status.textContent += "  (copied)"; }catch(e){}
  });

  // cosmetic
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
