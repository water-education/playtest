<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Debugger v1.3</title>
    <style>
   body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #121212;
    color: #e0e0e0;
    margin: 0;
    padding: 0;
  }
.viewport {
    height: 90vh;
    display: flex;
    flex-direction: column;
    background: #fff;
  }
.bar {
    background: #2d2d2d;
    color: #aaa;
    padding: 10px 20px;
    font-size: 12px;
    font-family: monospace;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
 .bar-success { border-bottom: 2px solid #4caf50; }

  #game-area {
    flex: 1;
    padding: 20px;
    overflow: auto;
    position: relative;
  }
    /* Loading Overlay */
.scan-line {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 2px;
    background: #00ff00;
    box-shadow: 0 0 10px #00ff00;
    animation: scan 2s linear infinite;
    display: none;
    z-index: 10;
  }
.loader {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
  }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes scan { 0% { top: 0; opacity: 1; } 100% { top: 100%; opacity: 0; } }
    </style>
</head>
<body>

<div class="viewport">
    <div class="bar" id="status-bar">
    <span id="status-text">SYSTEM READY</span>
    <span id="status-sub">WAITING FOR INPUT...</span>
    </div>
    <div id="game-area">
    <div id="loader-overlay" style="text-align:center; padding: 50px;">
    <div class="loader"></div>
    <p style="margin-top: 10px; color: #666;">Establishing Secure Tunnel...</p>
    </div>
    </div>
</div>

<script>
   // -------------------------------------------------------------------------
    // 1. CONFIGURATION
   // -------------------------------------------------------------------------
    // Using the Jina.ai proxy. 
    // Format: https://r.jina.ai/http://TARGET
    // See FAQ below if this link is blocked.
    const PROXY_URL = "https://r.jina.ai/http://tboi.online";

    const statusBar = document.getElementById('status-bar');
    const statusText = document.getElementById('status-text');
    const statusSub = document.getElementById('status-sub');
    const gameArea = document.getElementById('game-area');
    const loaderOverlay = document.getElementById('loader-overlay');

    async function loadGame() {
   try {
    // UI Update
    statusText.textContent = "CONNECTING TO HOST...";
    statusText.style.color = "#ff9800";
    loaderOverlay.style.display = "block";

    // Fetch
    const response = await fetch(PROXY_URL);

    if (!response.ok) {
    throw new Error(`Server returned ${response.status}`);
  }

    const html = await response.text();

    // Success State
    gameArea.innerHTML = html;
    statusText.textContent = "CONNECTION ESTABLISHED";
    statusSub.textContent = "Render successful via Proxy Gateway.";
    statusText.style.color = "#4caf50";
    loaderOverlay.style.display = "none"; // Hide loader
   statusBar.classList.add('bar-success');

    // Auto-resize fix (proxy sites sometimes lose viewport logic)
    setTimeout(() => {
    const iframe = gameArea.querySelector('iframe');
   if(iframe) {
    iframe.style.width = "100%";
    iframe.style.height = "100%";
   }
    }, 100);

    } catch (err) {
    console.error(err);
    gameArea.innerHTML = `
    <div style="background: #ffebee; padding: 20px; border-left: 5px solid #f44336;">
    <h3 style="margin-top:0;">CONNECTION ERROR</h3>
    <p>Could not connect to <strong>tboi.online</strong>.</p>
    <p><strong>Reason:</strong> ${err.message}</p>
    <p><em>The target server or proxy gateway might be blocked on this network.</em></p>
    </div>
   `;
    statusText.textContent = "CONNECTION FAILED";
    statusText.style.color = "#f44336";
    statusSub.textContent = "Verify manual link in browser.";
    loaderOverlay.style.display = "none";
   }
 }

    // Start loading on load
    window.addEventListener('load', () => {
    setTimeout(loadGame, 100);
 });

</script>

</body>
</html>
