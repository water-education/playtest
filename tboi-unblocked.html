<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Rail Link v4</title>
    <style>
   body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background-color: #000;
    color: #00ff00;
    font-family: 'Courier New', Courier, monospace;
 }

  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 40px;
    background: rgba(0, 50, 0, 0.8);
    border-bottom: 1px solid #00ff00;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    box-sizing: border-box;
  }

.status-dot {
    height: 12px;
    width: 12px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
 }

 .pulse-green { background-color: #00ff00; box-shadow: 0 0 5px #00ff00; animation: blink 1.5s infinite; }
 .pulse-red { background-color: #ff0000; animation: none; }

    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

   #game-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
 }

 iframe {
    width: 100%;
    height: 100%;
    border: none;
 }

 #loading-text {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 12px;
    color: #008800;
    z-index: 10;
  }
    </style>
</head>
<body>

<!-- UI Header -->
<div class="ui-layer">
    <span id="status-text">INITIALIZ CONNECTION PROTOCOLS...</span>
    <span id="latency-text">0ms</span>
</div>

<!-- Game Area -->
<div id="game-container">
    <iframe id="game-frame" src="about:blank"></iframe>
</div>

<div id="loading-text">Waiting for kernel handshake...</div>

<script>
   const statusEl = document.getElementById('status-text');
   const latencyEl = document.getElementById('latency-text');
   const gameFrame = document.getElementById('game-frame');

    async function loadGame() {
  try {
    // Update UI
    statusEl.textContent = "ESTABLISHING TUNNEL...";
    statusEl.style.color = "#ffff00";

    // Tracking latency
    const start = performance.now();

    // 1. Append the game URL to the current host (if possible) 
    // OR use the direct IP:PORT if blocked via simple logic.
    // Reverting to the most robust syntax:
    const targetUrl = "https://tboi.online";

    // 2. Inject the iframe source
    // We verify the connection actively by waiting for the DOM to match 'readyState'
    gameFrame.src = targetUrl;

    // 3. Monitor for load success
    gameFrame.onload = () => {
    const duration = Math.round(performance.now() - start);
    latencyEl.textContent = duration + "ms";
    statusEl.textContent = "CONNECTED";
    statusEl.style.color = "#00ff00";
    statusEl.classList.add('pulse-green');
  
    if(duration > 2000) {
    document.getElementById('loading-text').textContent = `Target loaded (${duration}ms delay). Starting Engine...`;
   } else {
    document.getElementById('loading-text').textContent = "Engine started.";
  }
 };

    // 4. Handle immediate failure
    gameFrame.onerror = () => {
    throw new Error("Network Handshake Failed");
  };
  
    // Fallback check
    if (gameFrame.contentDocument) {
    document.getElementById('loading-text').textContent = "Document established. Semantics parsing.";

    // If there is content waiting (some browsers load 'about:blank' first)
    if(gameFrame.contentDocument.readyState === 'complete') {
    gameFrame.onload();
  }
 }

    } catch (err) {
    console.error(err);
    statusEl.textContent = "CONNECTION REJECTED";
    statusEl.style.color = "#ff0000";
    document.getElementById('loading-text').textContent = "ERROR: Could not reach target.";
  }
 }

    // Start
    window.addEventListener('load', loadGame);

</script>

</body>
</html>
